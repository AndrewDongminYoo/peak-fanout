<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Open PeakCall</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f2f8fd;
        color: #17324a;
      }
      main {
        box-sizing: border-box;
        max-width: 30rem;
        margin: 1.5rem;
        padding: 2rem;
        border: 1px solid #d6e6f2;
        border-radius: 1rem;
        background: #fff;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #102435;
          color: #e3f1fb;
        }
        main {
          background: #19364c;
          border-color: #36566b;
        }
      }
    </style>
    <script>
      history.replaceState(null, '', location.pathname);
    </script>
  </head>
  <body>
    <main>
      <h1>Open PeakCall on your device</h1>
      <p>
        This sign-in link works in the app on the device that requested it. Open PeakCall there and
        request a new magic link if this one did not open the app.
      </p>
    </main>
  </body>
</html>
