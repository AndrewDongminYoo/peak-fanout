[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
reason = "decode-uri-component@0.2.2 via expo-router@57.0.20 -> query-string@7.1.3 has no compatible patch as of 2026-09-11: the only fix, 0.5.0, is ESM-only (type module, exports map without a require condition) while query-string@7.1.3 is CommonJS and requires it; expo-router 57.0.20 is the newest 57.x and pins query-string@^7.1.3, and query-string v8+ is ESM-only so overriding the parent moves the break up one level. DoS-only. Approved by Andrew (Dongmin Yu) on 2026-09-11. Re-evaluate when expo-router moves to query-string v9+."
