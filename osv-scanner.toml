[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
reason = "image-size@1.2.1 via metro@0.87.0 has no patched release as of 2026-09-11: the advisory lists no first_patched_version for <= 2.0.2 and 2.0.2 is the latest published version, itself affected. DoS-only, reachable solely from the dev-time Metro bundler, not from shipped app code. Approved by Andrew (Dongmin Yu) on 2026-09-11. Re-evaluate when metro bumps image-size."

