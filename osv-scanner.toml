reason = "braces@3.0.3 via micromatch@4.0.8 in Metro has no patched release as of 2026-10-04: OSV lists no first_patched_version and 3.0.3 is the latest published version, itself affected. DoS-only, reachable through the dev-time Metro bundler, not shipped app code. Approved by Andrew (Dongmin Yu) on 2026-10-04. Re-evaluate when braces publishes a patched release or Metro updates its dependency."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge@4.3.1 via @expo/config@57.0.9 (reached through expo, @expo/cli, @expo/metro-config and @expo/prebuild-config) has no patched release as of 2026-10-28: the advisory lists no first_patched_version for >= 4.2.0, <= 4.3.1, and 4.3.1 is the latest published version (npm view deepmerge version), itself affected. Low severity, prototype poisoning through mergeObject(). No first-party source imports deepmerge or @expo/config; whether the code runs in the shipped app bundle was not verified. Approved by Andrew (Dongmin Yu) on 2026-10-28. Re-evaluate when deepmerge publishes a patched release or @expo/config drops it."

[[IgnoredVulns]]
id = "GHSA-qr28-fpjm-wq7f"
reason = "decode-uri-component@0.2.2 via expo-router@57.0.29 -> query-string@7.1.3 has no compatible patch as of 2026-11-05: the advisory covers <= 0.5.0 and the fix, 0.5.1, is ESM-only while query-string@7.1.3 is CommonJS and requires it; expo-router 57.0.29 is the newest 57.x and still pins query-string@^7.1.3. Same package, path and blocker as GHSA-vcc3-ghjq-m6fr. High severity, DoS through quadratic replacement of percent-encoded runs. Approved by Andrew (Dongmin Yu) on 2026-11-05. Re-evaluate when expo-router moves to query-string v9+."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 via the eslint@10.12.0 devDependency -> @eslint/config-array@0.23.5 has no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1, the fix is minimatch 11, and @eslint/config-array 0.23.5, its latest release, still requires minimatch@^10.2.4. minimatch 11 removes makeRe() and the AST export, so an override would break the lint toolchain. Medium severity, DoS through globparts. Reached only by lint tooling, not shipped app code. Approved by Andrew (Dongmin Yu) on 2026-11-05. Re-evaluate when @eslint/config-array accepts minimatch 11."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "glob@13.0.6 via expo@57.0.31 -> @expo/cli@57.0.32 has no compatible patch as of 2026-11-05: the advisory covers >= 9.0.0, <= 14.0.1, the fix is glob 14.0.2, and @expo/cli 57.0.32, the newest 57.x, still requires glob@^13.0.0. Medium severity, AbortSignal cancellation bypass that allows filesystem traversal after a timeout. No first-party source imports glob; it is reached through the Expo CLI, and whether any shipped app bundle includes it was not verified. Approved by Andrew (Dongmin Yu) on 2026-11-05. Re-evaluate when @expo/cli accepts glob 14."
