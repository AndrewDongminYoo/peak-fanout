version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # The Expo SDK owns the version of every package listed in
    # `node_modules/expo/bundledNativeModules.json`, and `bunx expo install --fix` is what moves
    # one (apps/mobile/AGENTS.md). `lockfile-only` makes Dependabot update `bun.lock` only within
    # the range each manifest already declares, so an exact pin gets nothing, a tilde range gets
    # patches, a caret range at 1.0 or later gets minors, and a caret range on a 0.x version gets
    # patches only. That respects every SDK pin and range without maintaining the list of SDK
    # packages here, where it was six names against 123. The accepted cost is on the API and db
    # side: `drizzle-orm ^0.45.2`, `drizzle-kit ^0.31.10` and `@sinclair/typebox ^0.34.52` are
    # 0.x carets, so a minor such as drizzle-orm 0.46 is never proposed here and has to be raised
    # by hand. The strategy governs security updates too: those are disabled on this repository
    # and a security advisory is handled by hand (see 2aee384), so enabling them would not restore
    # a fix that needs a manifest change.
    versioning-strategy: lockfile-only
    ignore:
      # ESLint 10 is unusable here until Expo's shared config supports it: `eslint-config-expo`
      # depends on `eslint-plugin-react`, whose latest release (7.37.5) declares no ESLint 10
      # support and crashes under it with `contextOrFilename.getFilename is not a function`.
      # Under `lockfile-only` no major ever reaches a manifest, so these two entries cannot fire;
      # they record why a major needs a human. Drop them once `eslint-plugin-react` ships
      # ESLint 10 support.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
