# cspell — https://cspell.org/configuration/
# Scan surface lives here, not in the gate command: the gate is a bare `cspell .`.
# This root config takes precedence over the default exported by the quality-configs trunk plugin;
# project vocabulary stays in .cspell/custom-dictionary.txt.
version: '0.2'
language: en
useGitignore: true
# Tracked dot-paths exist (.claude/, .vscode/, .prettierrc.mjs), so dot-files are checked too.
enableGlobDot: true
ignorePaths:
  - .git # the git database is not prose; required exactly because enableGlobDot is on
  - '**/*.lock' # generated lock files (bun.lock)
  - osv-scanner.toml # security advisory ids are random strings, not vocabulary
  - supabase/config.toml # written by `supabase init`; its comments name third-party vendors, not our vocabulary
  - load/results/*.json # written by the load harness and committed unedited (AGENTS.md gate rule 4); worker ids carry the measuring machine's hostname
dictionaries:
  - node
  - npm
  - typescript
  - softwareTerms
  - filetypes
  - fonts
  - custom-dictionary
dictionaryDefinitions:
  - name: custom-dictionary
    path: ./.cspell/custom-dictionary.txt
    addWords: true
